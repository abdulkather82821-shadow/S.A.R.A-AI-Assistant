name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'desktop_launcher.py'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements*.txt'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Source tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Run offline tests
        run: python -m pytest -q

  windows-installer:
    name: Windows x64 installer
    needs: linux-tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: true
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Test, freeze, build installer, and test install / uninstall
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows download
        uses: actions/upload-artifact@v5
        with:
          name: SARA-Windows-x64
          path: |
            dist/installer/SARA-Setup-*-x64.exe
            dist/installer/*.sha256
            dist/installer/INSTALL-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
