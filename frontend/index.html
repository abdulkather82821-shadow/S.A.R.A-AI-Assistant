<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00d4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>S.A.R.A — Smart Assistant for Responsive Actions</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%2300d4ff' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%2300d4ff' stroke-width='1' opacity='0.6'/%3E%3Ctext x='50' y='58' text-anchor='middle' font-size='26' fill='%2300d4ff' font-family='monospace'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Animated background grid + stars -->
  <div class="bg-grid"></div>
  <canvas id="starfield"></canvas>
  <div class="scanlines"></div>

  <!-- Boot screen -->
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-logo">S.A.R.A</div>
      <div class="boot-sub">Smart Assistant for Responsive Actions</div>
      <div class="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-status" class="boot-status">Initializing core systems…</div>
    </div>
  </div>

  <!-- Main HUD -->
  <div id="hud" class="hud hidden">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 64 64" width="32" height="32">
            <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7"/>
            <circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            <circle cx="32" cy="32" r="3" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">S.A.R.A</div>
          <div class="brand-sub" id="brand-sub">Standing by</div>
        </div>
      </div>
      <div class="sys">
        <div class="sys-item"><span class="sys-label">TIME</span><span id="sys-time" class="sys-val">--:--</span></div>
        <div class="sys-item"><span class="sys-label">STATUS</span><span id="sys-status" class="sys-val ok">ONLINE</span></div>
        <div class="sys-item"><span class="sys-label">BATTERY</span><span id="sys-battery" class="sys-val">--%</span></div>
      </div>
    </header>

    <!-- Main area -->
    <main class="main">
      <!-- Left panel: visualizer + orb -->
      <section class="panel panel-core">
        <div class="panel-title">
          <span class="dot"></span> NEURAL CORE
        </div>
        <div class="core-wrap">
          <div class="core">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="core-pulse" id="core-pulse"></div>
            <div class="core-center">S</div>
            <canvas id="viz" class="viz" width="400" height="400"></canvas>
          </div>
          <div class="voice-wave" id="voice-wave">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="listen-hint" id="listen-hint">Tap the microphone or say "Hey Sara"</div>
        </div>
      </section>

      <!-- Right panel: conversation -->
      <section class="panel panel-chat">
        <div class="panel-title">
          <span class="dot"></span> CONVERSATION LOG
          <button id="clear-btn" class="mini-btn" title="Clear conversation">CLEAR</button>
        </div>
        <div id="chat" class="chat"></div>

        <!-- Tool events feed -->
        <div id="tool-feed" class="tool-feed"></div>

        <!-- Input -->
        <div class="input-row">
          <button id="mic-btn" class="mic-btn" aria-label="Hold to speak">
            <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
          </button>
          <input id="text-input" type="text" placeholder="Speak or type a command…" autocomplete="off" />
          <button id="send-btn" class="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>S.A.R.A v1.1 · Powered by Google Gemini &amp; ElevenLabs</span>
      <span id="conn-dot" class="conn-dot">●</span>
    </footer>
  </div>

  <!-- Wake greeting audio (hidden) -->
  <audio id="wake-audio" style="display:none"></audio>
  <audio id="tts-audio" style="display:none"></audio>

  <script src="/js/app.js"></script>
</body>
</html>
